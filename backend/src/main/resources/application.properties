spring.application.name=fairplay

# Configurações do MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/fairplay_tcc?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Administrador master e sessões de login
# Troque a senha definindo a variável de ambiente FAIRPLAY_ADMIN_SENHA (o padrão "master" é só para desenvolvimento)
fairplay.admin.usuario=${FAIRPLAY_ADMIN_USUARIO:master}
fairplay.admin.senha=${FAIRPLAY_ADMIN_SENHA:master}
fairplay.sessao.duracao-horas=8
