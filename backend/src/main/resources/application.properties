spring.application.name=fairplay

# Porta HTTP (as plataformas de hospedagem informam pela variável PORT)
server.port=${PORT:8080}

# Endereços do frontend autorizados a chamar a API (separados por vírgula)
fairplay.cors.origens=${CORS_ORIGENS:http://localhost:5173,http://127.0.0.1:5173}

# ---------------------------------------------------------------- Banco de dados (MySQL)
# A senha fica fora do git: em backend/config/application.properties (carregado automaticamente)
# ou na variável de ambiente DB_SENHA. Veja o README.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fairplay_tcc?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_SENHA:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------- Esquema do banco
# As tabelas são criadas e alteradas só pelas migrações do Liquibase (src/main/resources/db/changelog)
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------------------------------------------------------------- Administrador master e sessões de login
# Troque a senha definindo a variável de ambiente FAIRPLAY_ADMIN_SENHA (o padrão "master" é só para desenvolvimento)
fairplay.admin.usuario=${FAIRPLAY_ADMIN_USUARIO:master}
fairplay.admin.senha=${FAIRPLAY_ADMIN_SENHA:master}
fairplay.sessao.duracao-horas=8

# ---------------------------------------------------------------- Recuperação de senha
# Endereço do frontend usado no link enviado por e-mail
fairplay.frontend.url=${FRONTEND_URL:http://localhost:5173}
fairplay.recuperacao-senha.validade-minutos=60
fairplay.email.remetente=${EMAIL_REMETENTE:nao-responda@fairplay.local}
# Servidor de e-mail (SMTP). Sem spring.mail.host configurado, o link de recuperação é
# apenas escrito no log do backend, o que basta para desenvolvimento.
