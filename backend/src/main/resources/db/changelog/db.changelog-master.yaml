# Migrações do banco, aplicadas automaticamente pelo Liquibase ao iniciar o backend, em ordem.
# Nunca altere um arquivo já aplicado: crie um novo e inclua abaixo.
databaseChangeLog:
  - include:
      file: db/changelog/001-esquema-inicial.sql
  - include:
      file: db/changelog/002-resultados-senhas-historico.sql
  - include:
      file: db/changelog/003-limpeza-e-organizacao.sql
  - include:
      file: db/changelog/004-vinculos-por-competicao.sql
  - include:
      file: db/changelog/005-reauditoria-automatica.sql
  - include:
      file: db/changelog/006-nao-desce-e-sem-cadastro.sql
